# A tag is the whole release procedure. Obsidian's installer fetches the three
# files below as loose release assets, so they are uploaded individually and
# never as a zip. Samples belong in sample/downloads, not release assets.
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write
  # Artifact attestations are signed against the workflow's own identity, so
  # they need a token that can prove it and somewhere to record the claim.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # The tag names the version users will be offered; the manifest names the
      # version they will get. A release where those disagree is worse than no
      # release, so stop here rather than publish one.
      - name: The tag and the manifest must agree
        run: |
          tag="${GITHUB_REF_NAME}"
          manifest="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$manifest" ]; then
            echo "tag $tag but manifest.json says $manifest" >&2
            exit 1
          fi
          node -e 'const m=require("./manifest.json"); const p=require("./package.json"); const v=require("./versions.json"); if(p.version!==m.version || v[m.version]!==m.minAppVersion) throw Error("Version metadata does not agree");'

      - run: npm test

      - run: npm run build

      # Sign what is about to be uploaded, so that a user - or a reviewer - can
      # check that these three files were built by this workflow from this
      # commit, rather than assembled by hand and attached.
      - name: Attest the release assets
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "${GITHUB_REF_NAME}" --verify-tag \
              --title "${GITHUB_REF_NAME}" --notes-file "$notes" \
              main.js manifest.json styles.css
          else
            gh release create "${GITHUB_REF_NAME}" --verify-tag \
              --title "${GITHUB_REF_NAME}" --generate-notes \
              main.js manifest.json styles.css
          fi
          gh release view "${GITHUB_REF_NAME}" --json assets \
            | jq -e '.assets | map(.name) | sort == ["main.js", "manifest.json", "styles.css"]'
